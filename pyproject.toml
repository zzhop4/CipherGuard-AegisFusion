[project]
name = "cipherguard-aegisfusion"
version = "0.1.0"
description = "Encrypted-traffic malicious behavior detection and explainable attribution"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "catboost==1.2.10",
  "scikit-learn==1.9.0",
  "matplotlib==3.11.1",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
