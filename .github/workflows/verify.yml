name: Source Verification

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-source-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify source-only production path
        env:
          CIPHERGUARD_PYTHON: python
        run: bash scripts/verify_system.sh

  verify-clean-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci-lock-linux-py311.txt

      - name: Install verified Linux Python 3.11 dependency lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-lock-linux-py311.txt
          python -m pip check

      - name: Verify direct dependency contract matches lock
        run: |
          python - <<'PY'
          import importlib.metadata as md
          from pathlib import Path
          from packaging.requirements import Requirement

          direct = []
          for raw in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              req = Requirement(line)
              direct.append(req)
              installed = md.version(req.name)
              assert req.specifier.contains(installed, prereleases=True), (
                  f"{req.name}: installed {installed} does not satisfy {req.specifier}"
              )
              print(f"{req.name}=={installed}")

          assert len(direct) == 9, f"unexpected direct dependency count: {len(direct)}"
          PY

      - name: Import runtime dependency surface
        run: |
          python - <<'PY'
          import numpy
          import pandas
          import pyarrow
          import catboost
          import sklearn
          import matplotlib
          import fastapi
          import uvicorn
          import pydantic
          print("RUNTIME_IMPORT_SURFACE_OK")
          PY

      - name: Load formal training entrypoints
        run: |
          python training/train_hierarchical_catboost.py --help >/dev/null
          python training/train_temporal_infiltration_expert.py --help >/dev/null
          echo TRAINING_ENTRYPOINTS_OK

      - name: Import portable model service without model assets
        run: |
          python - <<'PY'
          from services.model_runtime.aegisfusion_service.app import app, runtime
          assert app.title == "AegisFusion_NIDS Model Service"
          assert runtime.ready is False
          print("MODEL_SERVICE_IMPORT_OK")
          PY

  verify-public-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Export allowlisted clean showcase tree
        run: |
          python scripts/export_public_tree.py --output "$RUNNER_TEMP/cipherguard-public"
          test ! -e "$RUNNER_TEMP/cipherguard-public/.git"
          test ! -e "$RUNNER_TEMP/cipherguard-public/research/domain_generalization/legacy"
          test ! -e "$RUNNER_TEMP/cipherguard-public/backend/attack_lab.py"

      - name: Audit exported tree
        run: |
          python "$RUNNER_TEMP/cipherguard-public/scripts/audit_public_tree.py" \
            --root "$RUNNER_TEMP/cipherguard-public"

      - name: Re-run source verification from exported tree
        env:
          CIPHERGUARD_PYTHON: python
        run: |
          bash "$RUNNER_TEMP/cipherguard-public/scripts/verify_system.sh"
